<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image to Text</title>
  <style>
    :root {
      color-scheme: light;
      --desktop: #c8c8cc;
      --title: #ececee;
      --sidebar: #f5f5f7;
      --paper: #ffffff;
      --line: #d2d2d7;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --blue: #007aff;
      --blue-press: #0063d1;
      --danger: #ff3b30;
      --select: #d6e6ff;
      font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--desktop);
      display: grid;
      place-items: center;
      min-height: 100%;
    }
    .window {
      width: min(1040px, calc(100vw - 48px));
      height: min(700px, calc(100vh - 48px));
      background: var(--paper);
      border: 1px solid rgba(0, 0, 0, 0.22);
      border-radius: 10px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22), 0 0 0 0.5px rgba(255, 255, 255, 0.4) inset;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .titlebar {
      height: 38px;
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px 0 14px;
      background: linear-gradient(#f6f6f8, var(--title));
      border-bottom: 1px solid #e1e1e4;
    }
    .toolbar {
      height: 38px;
      flex: none;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      background: #f6f6f8;
      border-bottom: 1px solid var(--line);
    }
    .lights { display: flex; gap: 8px; width: 68px; }
    .lights i {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: block;
      box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.18);
    }
    .lights .close { background: #ff5f57; }
    .lights .min { background: #febc2e; }
    .lights .zoom { background: #28c840; }
    .title {
      flex: 1;
      text-align: center;
      font-weight: 600;
      font-size: 13px;
      margin-right: 68px;
    }
    button, .file-btn {
      font: 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      height: 24px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid #c6c6c8;
      background: linear-gradient(#fff, #f3f3f5);
      color: var(--ink);
      cursor: pointer;
      box-shadow: inset 0 0.5px 0 #fff;
    }
    button.primary {
      background: linear-gradient(#3d94ff, var(--blue));
      border-color: #0066d6;
      color: white;
      font-weight: 590;
    }
    button.primary:disabled { background: #b7d7ff; border-color: #b7d7ff; color: white; }
    button:disabled, .file-btn:disabled { opacity: 0.55; cursor: default; }
    .body { flex: 1; display: flex; min-height: 0; }
    .sidebar {
      width: 248px;
      flex: none;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .label {
      margin: 12px 14px 6px;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    #drop {
      margin: 0 12px 8px;
      min-height: 92px;
      border: 1px dashed #b5b5ba;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 10px;
    }
    #drop.over { border-color: var(--blue); background: #eaf3ff; color: var(--ink); }
    #queue, #history {
      list-style: none;
      margin: 0;
      padding: 0 8px;
      overflow: auto;
    }
    #history { flex: 1; }
    #queue li, #history li {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 28px;
      padding: 4px 8px;
      border-radius: 6px;
    }
    #history li { cursor: pointer; }
    #history li:hover, #queue li:hover { background: rgba(0, 0, 0, 0.04); }
    #history li.on { background: var(--select); }
    #queue li span, #history li span {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    a.download {
      color: var(--blue);
      text-decoration: none;
      font-size: 12px;
      flex: none;
    }
    .empty { color: var(--muted); cursor: default !important; }
    .editor { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--paper); }
    textarea {
      flex: 1;
      width: 100%;
      border: 0;
      resize: none;
      padding: 16px 18px;
      font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color: var(--ink);
      background: transparent;
      outline: none;
    }
    .status {
      flex: none;
      height: 26px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border-top: 1px solid var(--line);
      background: #f6f6f8;
      color: var(--muted);
      font-size: 11px;
    }
    .status.bad { color: var(--danger); }
    body.shell { background: var(--paper); display: block; }
    body.shell .window {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
    body.shell .titlebar { display: none; }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="lights" aria-hidden="true"><i class="close"></i><i class="min"></i><i class="zoom"></i></div>
      <div class="title">Image to Text</div>
    </div>
    <div class="toolbar">
      <label class="file-btn">Choose<input id="picker" type="file" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg" multiple hidden /></label>
      <button id="convert" class="primary" disabled>Convert</button>
      <button id="download" disabled>Download</button>
      <button id="clear">Clear</button>
    </div>
    <div class="body">
      <aside class="sidebar">
        <div class="label">FILES</div>
        <div id="drop">Drop PDF, PNG, or JPG</div>
        <ul id="queue"></ul>
        <div class="label">HISTORY</div>
        <ul id="history"></ul>
      </aside>
      <section class="editor">
        <textarea id="text" readonly placeholder="Converted text shows up here."></textarea>
        <div id="status" class="status">Loading Unlimited-OCR…</div>
      </section>
    </div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get("shell") === "1") {
      document.body.classList.add("shell");
    }
    const drop = document.querySelector("#drop");
    const picker = document.querySelector("#picker");
    const convertBtn = document.querySelector("#convert");
    const downloadBtn = document.querySelector("#download");
    const clearBtn = document.querySelector("#clear");
    const statusEl = document.querySelector("#status");
    const textEl = document.querySelector("#text");
    const historyEl = document.querySelector("#history");
    const queueEl = document.querySelector("#queue");
    let files = [];
    let ready = false;

    function setStatus(message, bad) {
      statusEl.textContent = message;
      statusEl.classList.toggle("bad", !!bad);
    }

    function renderFiles() {
      convertBtn.disabled = !ready || files.length === 0;
      queueEl.innerHTML = "";
      if (!files.length) {
        drop.textContent = "Drop PDF, PNG, or JPG";
        return;
      }
      drop.textContent = files.length + " file" + (files.length === 1 ? "" : "s") + " ready";
      for (const file of files) {
        const li = document.createElement("li");
        const name = document.createElement("span");
        name.textContent = file.name;
        li.append(name);
        queueEl.appendChild(li);
      }
    }

    function addFiles(list) {
      const next = [...list].filter((f) => /\.(pdf|png|jpe?g)$/i.test(f.name));
      if (!next.length) {
        setStatus("Use PDF, PNG, or JPG.", true);
        return;
      }
      files = next;
      renderFiles();
      setStatus(next.length + " file" + (next.length === 1 ? "" : "s") + " ready.", false);
    }

    picker.addEventListener("change", () => addFiles(picker.files));
    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (e) => {
      e.preventDefault();
      drop.classList.remove("over");
      addFiles(e.dataTransfer.files);
    });
    clearBtn.addEventListener("click", () => {
      files = [];
      picker.value = "";
      textEl.value = "";
      downloadBtn.disabled = true;
      renderFiles();
      document.querySelectorAll("#history li.on").forEach((el) => el.classList.remove("on"));
      setStatus(ready ? "Ready. Drop PDF, PNG, or JPG." : "Loading Unlimited-OCR…", false);
    });

    function b64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(",")[1]);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    convertBtn.addEventListener("click", async () => {
      convertBtn.disabled = true;
      downloadBtn.disabled = true;
      const parts = [];
      try {
        for (let i = 0; i < files.length; i++) {
          setStatus("Reading " + (i + 1) + " of " + files.length + "… On a CPU this can take several minutes.", false);
          const res = await fetch("/file", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: files[i].name, data: await b64(files[i]) }),
          });
          const body = await res.json();
          if (!res.ok) throw new Error(body.error || "Convert failed");
          parts.push("=== " + files[i].name + " ===\n" + body.text);
        }
        textEl.value = parts.join("\n\n");
        downloadBtn.disabled = !textEl.value.trim();
        setStatus("Saved to History.", false);
        loadHistory();
      } catch (err) {
        setStatus(err.message || String(err), true);
      } finally {
        convertBtn.disabled = files.length === 0 || !ready;
      }
    });

    downloadBtn.addEventListener("click", () => {
      const blob = new Blob([textEl.value], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "image-to-text.txt";
      a.click();
      URL.revokeObjectURL(a.href);
    });

    async function showHistory(name, row) {
      const res = await fetch("/history/" + encodeURIComponent(name));
      if (!res.ok) return;
      textEl.value = await res.text();
      downloadBtn.disabled = !textEl.value.trim();
      document.querySelectorAll("#history li.on").forEach((el) => el.classList.remove("on"));
      row.classList.add("on");
      setStatus(name, false);
    }

    async function loadHistory() {
      const res = await fetch("/history");
      const body = await res.json();
      historyEl.innerHTML = "";
      if (!body.files.length) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = "No conversions yet";
        historyEl.appendChild(li);
        return;
      }
      for (const file of body.files) {
        const li = document.createElement("li");
        const name = document.createElement("span");
        name.textContent = file.name;
        const link = document.createElement("a");
        link.className = "download";
        link.href = "/history/" + encodeURIComponent(file.name);
        link.textContent = "Download";
        li.append(name, link);
        li.addEventListener("click", (event) => {
          if (event.target === link) return;
          showHistory(file.name, li);
        });
        historyEl.appendChild(li);
      }
    }

    async function poll() {
      try {
        const res = await fetch("/health");
        const body = await res.json();
        if (res.ok && body.ok) {
          ready = true;
          if (!files.length && !textEl.value) setStatus("Ready. Drop PDF, PNG, or JPG.", false);
          renderFiles();
          return;
        }
        const loading = !body.error || body.error === "loading";
        setStatus(loading ? "Loading Unlimited-OCR…" : body.error, !loading);
      } catch (err) {
        setStatus("Loading Unlimited-OCR…", false);
      }
      setTimeout(poll, 1000);
    }

    loadHistory();
    poll();
  </script>
</body>
</html>
